<!doctype html><html lang="en" data-theme="custom"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJ-IQ</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body><header><div><small>IQ / AUDIO INTELLIGENCE</small><h1>DJ-IQ <small>0.1.0</small></h1></div><label>Theme <select id="theme"><option value="custom">Execution Desk</option><option value="dark">Original dark</option><option value="light">Light</option><option value="ocean">Ocean</option><option value="midnight">Midnight</option><option value="plum">Plum</option><option value="sand">Sand</option></select></label></header><main><div class="status">MANUAL MIXING · LOCAL AUDIO · AI ADVISORY</div><section class="decks"><article><small>DECK A</small><h2 id="nameA">Load a track</h2><label>Audio file <input id="fileA" type="file" accept="audio/*"></label><audio id="audioA" controls preload="metadata"></audio></article><article><small>DECK B</small><h2 id="nameB">Load a track</h2><label>Audio file <input id="fileB" type="file" accept="audio/*"></label><audio id="audioB" controls preload="metadata"></audio></article></section><article><h2>Mixer</h2><label for="fade">Crossfader · <output id="mix">50%</output></label><div class="fader"><span>A</span><input id="fade" type="range" min="0" max="100" value="50"><span>B</span></div><button id="enable">Enable audio mixer</button><p id="audioStatus" role="status">Enable mixer before playback for equal-power gain control.</p></article><article><h2>AI Director</h2><div class="settings"><label>Provider <select id="provider"><option value="offline">Offline</option><option value="ollama">Local Ollama</option><option value="remote-ollama">Remote Ollama</option><option value="anthropic">Claude API</option><option value="openai-compatible">Compatible API</option></select></label><label>Model <input id="model" value="qwen3:8b"></label></div><label for="prompt">Mixing brief</label><textarea id="prompt" rows="3" maxlength="4000" placeholder="Describe your desired transition"></textarea><button id="ask">Plan transition</button><p id="advice" role="status">No plan requested.</p></article></main></body></html>
